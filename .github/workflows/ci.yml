# CI: ejecuta las pruebas unitarias y compila la app en cada PR hacia develop/main para detectar errores antes de revisar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores ficticios: el build no se conecta a Supabase.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pruebas puras (nómina, montos de órdenes, auth, CSV): no requieren Supabase.
      - run: npm test
      - run: npm run build
      # Valida tipos (vue-tsc). `nuxt prepare` corre en el postinstall de npm ci.
      - run: npm run typecheck

  # E2E de humo: compila la app y la recorre con Playwright (Chromium) sin base de
  # datos. Con las credenciales ficticias las llamadas a Supabase fallan a propósito:
  # se prueba que las rutas públicas rendericen, que el panel redirija al login y
  # que /health responda. Si falla, el reporte HTML queda como artefacto.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
