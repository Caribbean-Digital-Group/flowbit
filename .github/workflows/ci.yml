# CI: ejecuta las pruebas unitarias, compila la app y valida las migraciones SQL en cada PR hacia develop/main para detectar errores antes de revisar.
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Valores ficticios: el build no se conecta a Supabase.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pruebas puras (nómina, montos de órdenes, auth, CSV): no requieren Supabase.
      - run: npm test
      - run: npm run build
      # Valida tipos (vue-tsc). `nuxt prepare` corre en el postinstall de npm ci.
      - run: npm run typecheck

  # E2E de humo: compila la app y la recorre con Playwright (Chromium) sin base de
  # datos. Con las credenciales ficticias las llamadas a Supabase fallan a propósito:
  # se prueba que las rutas públicas rendericen, que el panel redirija al login y
  # que /health responda. Si falla, el reporte HTML queda como artefacto.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NUXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Migraciones SQL (TRY-48): aplica toda la cadena de supabase/migrations sobre un
  # PostgreSQL 16 limpio con stubs de Supabase (roles, auth, storage). Así un error
  # de SQL se ve en el PR y no hasta que db-migrations.yml hace `db push` en main.
  # Corre en cada PR, sin filtro de rutas, para que pueda marcarse como check requerido.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo para comparar contra la rama base del PR.
          fetch-depth: 0
      # No se editan migraciones pasadas y las nuevas van después de la última de la base.
      - name: Historial de migraciones
        if: github.event_name == 'pull_request'
        run: scripts/ci/check-migration-history.sh "origin/${{ github.base_ref }}"
      - name: Aplicar migraciones
        run: scripts/ci/check-migrations.sh
